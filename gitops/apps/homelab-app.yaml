apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-app
  namespace: argocd
  finalizers:
      - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
      repoURL: https://github.com/umuttvar/homelab.git
      path: gitops/charts/homelab-app
      targetRevision: main
      
  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true