- name: Master'da cluster'ı kur
  hosts: masters
  become: true

  tasks:
    - name: kubeadm init
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ ansible_host }}
        --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Flannel kurulu olsun
      ansible.builtin.command: >
        kubectl apply
        -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel
      changed_when: "'created' in flannel.stdout or 'configured' in flannel.stdout"

    - name: Join komutu üretilsin
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: kubeconfig WSL'e indirilsin
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: ~/.kube/homelab.conf
        flat: true

- name: Worker'ları cluster'a kat
  hosts: workers
  become: true

  tasks:
    - name: kubeadm join
      ansible.builtin.command: "{{ hostvars['homelab-master'].join_command.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf